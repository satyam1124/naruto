<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>naruto</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

  <style>
    body { margin: 0; overflow: hidden; background-color: black; }
    #v_src, #out {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: cover; transform: scaleX(-1);
    }
    #out { z-index: 2; pointer-events: none; }
    .darkness {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(10, 5, 0, 0.3);
      mix-blend-mode: multiply; pointer-events: none; z-index: 5;
    }
    .fx {
      position: absolute; height: auto; top: 0; left: 0;
      transform: translate(-50%, -50%);
      pointer-events: none; display: none;
      mix-blend-mode: screen; z-index: 20;
    }
    #n { width: 1600px; }
    #s { width: 2400px; }
  </style>
</head>
<body>

  <video id="v_src" autoplay playsinline></video>
  <canvas id="out"></canvas>
  <div class="darkness"></div>

  <video id="n" class="fx" src="assets/naruto.mp4" muted autoplay loop playsinline></video>
  <video id="s" class="fx" src="assets/sasuke.mp4" muted autoplay loop playsinline></video>

  <script>
    const vElement = document.getElementById('v_src');
    const cElement = document.getElementById('out');
    const ctx = cElement.getContext('2d');
    const n = document.getElementById('n');
    const s = document.getElementById('s');

    let pwr = [0, 0]; 
    let wasOpen = [false, false];

    // --- SOUND EFFECTS ---
    let audioCtx = null;
    let rasenganNodes = null;
    let chidoriNodes = null;

    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }

    // Suspend the AudioContext when the page is hidden to save power,
    // and resume it when the page becomes visible again.
    document.addEventListener('visibilitychange', () => {
      if (!audioCtx) return;
      if (document.hidden) {
        if (audioCtx.state === 'running') audioCtx.suspend();
      } else {
        if (audioCtx.state === 'suspended') audioCtx.resume();
      }
    });

    // --- RASENGAN / WIND STYLE ---
    // Deep spinning wind whoosh: layered filtered noise + a pitch roar that swells then settles.
    function playRasenganSound() {
      const ac = getAudioCtx();
      ac.resume();
      stopRasenganSound();
      const t = ac.currentTime;

      // Master gain – fade in over 0.5 s
      const master = ac.createGain();
      master.gain.setValueAtTime(0, t);
      master.gain.linearRampToValueAtTime(0.45, t + 0.5);
      master.connect(ac.destination);

      // Layer 1: low-freq wind roar – white noise through a low-pass sweep
      const bufLen = ac.sampleRate * 3;
      const buf = ac.createBuffer(1, bufLen, ac.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < bufLen; i++) d[i] = Math.random() * 2 - 1;
      const noise = ac.createBufferSource();
      noise.buffer = buf;
      noise.loop = true;
      const lpf = ac.createBiquadFilter();
      lpf.type = 'lowpass';
      lpf.frequency.setValueAtTime(180, t);
      lpf.frequency.linearRampToValueAtTime(520, t + 0.5);
      lpf.frequency.linearRampToValueAtTime(340, t + 1.2);
      lpf.Q.value = 3.5;
      const noiseGain = ac.createGain();
      noiseGain.gain.value = 0.6;
      noise.connect(lpf);
      lpf.connect(noiseGain);
      noiseGain.connect(master);
      noise.start();

      // Layer 2: spinning whoosh – band-pass noise modulated by a slow LFO
      const buf2 = ac.createBuffer(1, bufLen, ac.sampleRate);
      const d2 = buf2.getChannelData(0);
      for (let i = 0; i < bufLen; i++) d2[i] = Math.random() * 2 - 1;
      const noise2 = ac.createBufferSource();
      noise2.buffer = buf2;
      noise2.loop = true;
      const bpf = ac.createBiquadFilter();
      bpf.type = 'bandpass';
      bpf.frequency.value = 600;
      bpf.Q.value = 1.2;
      // LFO sweeps the band-pass centre frequency to simulate rotation
      const lfo = ac.createOscillator();
      lfo.type = 'sine';
      lfo.frequency.value = 5;
      const lfoG = ac.createGain();
      lfoG.gain.value = 280;
      lfo.connect(lfoG);
      lfoG.connect(bpf.frequency);
      const bpGain = ac.createGain();
      bpGain.gain.value = 0.5;
      noise2.connect(bpf);
      bpf.connect(bpGain);
      bpGain.connect(master);
      noise2.start();
      lfo.start();

      // Layer 3: sub-bass rumble oscillator for the "chakra pressure" feel
      const sub = ac.createOscillator();
      sub.type = 'sawtooth';
      sub.frequency.setValueAtTime(55, t);
      sub.frequency.linearRampToValueAtTime(80, t + 0.6);
      sub.frequency.linearRampToValueAtTime(60, t + 1.5);
      const subFilter = ac.createBiquadFilter();
      subFilter.type = 'lowpass';
      subFilter.frequency.value = 160;
      const subGain = ac.createGain();
      subGain.gain.value = 0.18;
      sub.connect(subFilter);
      subFilter.connect(subGain);
      subGain.connect(master);
      sub.start();

      rasenganNodes = { noise, noise2, lfo, sub, master };
    }

    function stopRasenganSound() {
      if (rasenganNodes) {
        const nodes = rasenganNodes;
        rasenganNodes = null;
        const ac = getAudioCtx();
        try { nodes.master.gain.linearRampToValueAtTime(0, ac.currentTime + 0.3); } catch(e) {}
        setTimeout(() => {
          try { nodes.noise.stop(); } catch(e) {}
          try { nodes.noise2.stop(); } catch(e) {}
          try { nodes.lfo.stop(); } catch(e) {}
          try { nodes.sub.stop(); } catch(e) {}
        }, 350);
      }
    }

    // --- CHIDORI (ONE THOUSAND BIRDS) ---
    // Rapid electric crackling / chirping: layered high-freq noise bursts +
    // fast-modulated oscillators to mimic the iconic lightning-bird sound.
    function playChidoriSound() {
      const ac = getAudioCtx();
      ac.resume();
      stopChidoriSound();
      const t = ac.currentTime;

      // Master gain
      const master = ac.createGain();
      master.gain.setValueAtTime(0, t);
      master.gain.linearRampToValueAtTime(0.4, t + 0.12);
      master.connect(ac.destination);

      // Layer 1: crisp high-frequency crackling noise (bandpass around 4–6 kHz)
      const bufLen = ac.sampleRate * 2;
      const buf = ac.createBuffer(1, bufLen, ac.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < bufLen; i++) d[i] = Math.random() * 2 - 1;
      const noise = ac.createBufferSource();
      noise.buffer = buf;
      noise.loop = true;
      const hpf = ac.createBiquadFilter();
      hpf.type = 'highpass';
      hpf.frequency.value = 3800;
      hpf.Q.value = 0.7;
      const bpf = ac.createBiquadFilter();
      bpf.type = 'bandpass';
      bpf.frequency.value = 5500;
      bpf.Q.value = 0.5;
      const noiseGain = ac.createGain();
      noiseGain.gain.value = 0.55;
      noise.connect(hpf);
      hpf.connect(bpf);
      bpf.connect(noiseGain);
      noiseGain.connect(master);
      noise.start();

      // Layer 2: rapid "chirp" oscillator – fast amplitude LFO
      // gives the stuttering bird-flock / electric crackling rhythm
      const chirpOsc = ac.createOscillator();
      chirpOsc.type = 'sawtooth';
      chirpOsc.frequency.value = 1200;
      const chirpLFO = ac.createOscillator();
      chirpLFO.type = 'square';
      chirpLFO.frequency.value = 38; // ~38 Hz chosen to mimic the rapid "one thousand birds" chirping rhythm
      const chirpLFOGain = ac.createGain();
      chirpLFOGain.gain.value = 0.18;
      chirpLFO.connect(chirpLFOGain);
      const chirpAmpGain = ac.createGain();
      chirpAmpGain.gain.value = 0.15;
      chirpLFOGain.connect(chirpAmpGain.gain);
      chirpOsc.connect(chirpAmpGain);
      chirpAmpGain.connect(master);
      chirpOsc.start();
      chirpLFO.start();

      // Layer 3: electric buzz – fast-modulated mid-range oscillator
      const buzzOsc = ac.createOscillator();
      buzzOsc.type = 'square';
      buzzOsc.frequency.value = 320;
      const buzzLFO = ac.createOscillator();
      buzzLFO.type = 'sawtooth';
      buzzLFO.frequency.value = 60;
      const buzzLFOGain = ac.createGain();
      buzzLFOGain.gain.value = 90;
      buzzLFO.connect(buzzLFOGain);
      buzzLFOGain.connect(buzzOsc.frequency);
      const buzzFilter = ac.createBiquadFilter();
      buzzFilter.type = 'bandpass';
      buzzFilter.frequency.value = 2800;
      buzzFilter.Q.value = 1.5;
      const buzzGain = ac.createGain();
      buzzGain.gain.value = 0.1;
      buzzOsc.connect(buzzFilter);
      buzzFilter.connect(buzzGain);
      buzzGain.connect(master);
      buzzOsc.start();
      buzzLFO.start();

      chidoriNodes = { noise, chirpOsc, chirpLFO, buzzOsc, buzzLFO, master };
    }

    function stopChidoriSound() {
      if (chidoriNodes) {
        const nodes = chidoriNodes;
        chidoriNodes = null;
        const ac = getAudioCtx();
        try { nodes.master.gain.linearRampToValueAtTime(0, ac.currentTime + 0.15); } catch(e) {}
        setTimeout(() => {
          try { nodes.noise.stop(); } catch(e) {}
          try { nodes.chirpOsc.stop(); } catch(e) {}
          try { nodes.chirpLFO.stop(); } catch(e) {}
          try { nodes.buzzOsc.stop(); } catch(e) {}
          try { nodes.buzzLFO.stop(); } catch(e) {}
        }, 200);
      }
    }

    function checkOpen(pts) {
        let count = 0;
        const wrist = pts[0];
        const tips = [8, 12, 16, 20];
        const pips = [6, 10, 14, 18];
        for (let i = 0; i < tips.length; i++) {
            const tip = pts[tips[i]];
            const pip = pts[pips[i]];
            if (Math.hypot(tip.x - wrist.x, tip.y - wrist.y) > Math.hypot(pip.x - wrist.x, pip.y - wrist.y)) count++;
        }
        return count >= 3;
    }

    function onResults(res) {
        cElement.width = vElement.videoWidth;
        cElement.height = vElement.videoHeight;
        ctx.save();
        ctx.clearRect(0, 0, cElement.width, cElement.height);

        let fL = false;
        let fR = false;

        n.style.display = 'none';
        s.style.display = 'none';

        if (res.multiHandLandmarks && res.multiHandedness) {
            res.multiHandLandmarks.forEach((pts, i) => {
                const label = res.multiHandedness[i].label;
                const isR = label === 'Right';
                const idx = isR ? 1 : 0;

                ctx.save();
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00fbff';
                drawConnectors(ctx, pts, HAND_CONNECTIONS, {color: '#00d4ff', lineWidth: 3});
                drawLandmarks(ctx, pts, {color: '#ffffff', lineWidth: 1, radius: 2});
                ctx.restore();

                const open = checkOpen(pts);
                pwr[idx] += open ? 0.05 : -0.15;
                pwr[idx] = Math.max(0, Math.min(1, pwr[idx]));

                if (open && !wasOpen[idx]) {
                    const vid = isR ? s : n;
                    vid.currentTime = 0;
                    vid.play();
                    if (isR) playChidoriSound(); else playRasenganSound();
                }
                if (!open && wasOpen[idx]) {
                    if (isR) stopChidoriSound(); else stopRasenganSound();
                }
                wasOpen[idx] = open;

                const wrist = pts[0];
                const knk = pts[9];

                if (pwr[idx] > 0.01) {
                    if (isR) { 
                        fR = true;
                        const tx = (wrist.x + knk.x) / 2;
                        const ty = (wrist.y + knk.y) / 2;
                        s.style.left = `${(1 - tx) * window.innerWidth}px`;
                        s.style.top = `${ty * window.innerHeight}px`;
                        s.style.display = 'block';
                        s.style.opacity = pwr[idx]; 
                    } else { 
                        fL = true;
                        const dx = knk.x - wrist.x;
                        const dy = knk.y - wrist.y;
                        const tx = knk.x + (dx * 0.8);
                        const ty = knk.y + (dy * 0.8);
                        n.style.left = `${(1 - tx) * window.innerWidth}px`;
                        n.style.top = `${(ty * window.innerHeight) - 120}px`;
                        n.style.display = 'block';
                        n.style.opacity = pwr[idx]; 
                    }
                }
            });
        }

        if (!fL) {
            pwr[0] = Math.max(0, pwr[0] - 0.15);
            if (pwr[0] > 0.01) { n.style.display = 'block'; n.style.opacity = pwr[0]; }
            if (wasOpen[0]) stopRasenganSound();
            wasOpen[0] = false;
        }
        if (!fR) {
            pwr[1] = Math.max(0, pwr[1] - 0.15);
            if (pwr[1] > 0.01) { s.style.display = 'block'; s.style.opacity = pwr[1]; }
            if (wasOpen[1]) stopChidoriSound();
            wasOpen[1] = false;
        }
        ctx.restore();
    }

    const h = new Hands({
        locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
    });

    h.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.65,
        minTrackingConfidence: 0.65
    });

    h.onResults(onResults);

    const cam = new Camera(vElement, {
        onFrame: async () => { await h.send({ image: vElement }); },
        width: 1280, height: 720
    });
    cam.start();
  </script>
</body>
</html>
